# GOAL: to check the python code syntactically correct

name: Code Lint

on:
  # push:
  workflow_dispatch:

jobs:
  Code-Linter-and-Test:
    strategy:
      matrix:
        python-versions: ['3.12', '3.13', '3.14']

    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-versions}}

      - name: install dependencies
        run: pip install -r requirements.txt
        
      - name: code lint
        run: ruff check . 

      - name: code tests
        run: pytest