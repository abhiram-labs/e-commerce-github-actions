# GOAL: to check the python code syntactically correct

name: Code Lint

on:
  push:

jobs:
  Code-Linter-and-Test:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: install dependencies
        run: pip install -r requirements.txt
        
      - name: code lint
        run: ruff check . 

      - name: code tests
        run: pytest